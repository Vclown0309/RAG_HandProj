[project]
name = "rag-handproj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["main.py", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
