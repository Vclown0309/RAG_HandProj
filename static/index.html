<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 演示台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #222; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: #1f2430; color: #fff; padding: 18px 24px;
  }
  header h1 { font-size: 20px; letter-spacing: 1px; }
  header p { font-size: 12px; color: #9aa4b5; margin-top: 4px; }
  main {
    flex: 1; display: flex; gap: 16px; padding: 16px 24px; max-width: 1200px;
    width: 100%; margin: 0 auto; align-items: flex-start;
  }
  .ask-panel { flex: 1; min-width: 0; }
  form { display: flex; gap: 8px; }
  #query-input {
    flex: 1; padding: 10px 12px; font-size: 14px; border: 1px solid #d0d3da;
    border-radius: 6px; outline: none;
  }
  #query-input:focus { border-color: #1f6feb; }
  button {
    padding: 10px 18px; font-size: 14px; border: none; border-radius: 6px;
    background: #1f6feb; color: #fff; cursor: pointer;
  }
  button:hover { background: #1857c4; }
  #answer-area {
    margin-top: 14px; background: #fff; border: 1px solid #e0e3e8;
    border-radius: 8px; padding: 16px 18px; min-height: 200px;
    line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  #answer-area .loading { color: #6b7280; }
  #answer-area p { white-space: normal; }
  aside {
    width: 360px; background: #fff; border: 1px solid #e0e3e8; border-radius: 8px;
    padding: 14px 16px; max-height: 72vh; overflow-y: auto;
  }
  aside h2 { font-size: 14px; color: #444; margin-bottom: 10px; }
  aside ul { list-style: none; }
  aside li { margin-bottom: 8px; }
  .source-btn {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: #f0f2f5; border: 1px solid #e0e3e8; border-radius: 6px;
    padding: 8px 10px; color: #1f2430; text-align: left; font-size: 13px;
  }
  .source-btn:hover { background: #e6ebf5; }
  .src-doc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-idx { color: #1f6feb; font-weight: 600; margin-left: 8px; flex-shrink: 0; }
  .source-body { display: none; margin-top: 6px; padding: 10px; background: #fafbfc;
    border: 1px solid #e8eaef; border-radius: 6px; }
  .source-body.open { display: block; }
  .source-body h3 { font-size: 13px; color: #1f6feb; margin-bottom: 6px; }
  .source-body pre {
    font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    color: #333; font-family: ui-monospace, Consolas, monospace;
  }
  .empty { color: #9aa4b5; font-size: 13px; }
  footer {
    padding: 12px 24px; font-size: 12px; color: #9aa4b5; text-align: center;
  }
  @media (max-width: 800px) {
    main { flex-direction: column; }
    aside { width: 100%; max-height: none; order: 2; }
  }
</style>
</head>
<body>
<header>
  <h1>RAG 演示台</h1>
  <p>检索增强生成全链路 · 本地私有知识库问答 · 答案可溯源</p>
</header>
<main>
  <section class="ask-panel">
    <form id="ask-form">
      <input id="query-input" type="text" placeholder="输入问题，回车提问">
      <button type="submit">提问</button>
    </form>
    <div id="answer-area">输入问题开始体验：回答下方「参考源」可点击展开，查看模型依据的原文块。</div>
  </section>
  <aside id="sources-panel">
    <h2>参考源 · 点击展开原文块</h2>
    <ul id="sources-list">
      <li class="empty">提问后，这里会列出模型依据的知识块</li>
    </ul>
  </aside>
</main>
<footer>回答由本地 Qwen3.5 生成 · 依据来自知识库余弦检索</footer>
<script>
(function () {
  'use strict';

  var form = document.getElementById('ask-form');
  var input = document.getElementById('query-input');
  var answerArea = document.getElementById('answer-area');
  var sourcesList = document.getElementById('sources-list');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 极简 markdown：**粗体**、`代码`、换行分块；其余原样（已转义，安全）
  function renderMarkdown(text) {
    var html = escapeHtml(text);
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\n/g, '<br>');
    return '<p>' + html + '</p>';
  }

  function renderSources(sources) {
    sourcesList.innerHTML = '';
    if (!sources || !sources.length) {
      sourcesList.innerHTML = '<li class="empty">知识库暂无相关内容，先上传文档再问</li>';
      return;
    }
    sources.forEach(function (s, i) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.className = 'source-btn';
      btn.innerHTML = '<span class="src-doc">' + escapeHtml(s.source) + '</span>' +
        '<span class="src-idx">[资料 ' + (i + 1) + ']</span>';
      var body = document.createElement('div');
      body.className = 'source-body';
      body.innerHTML = '<h3>' + escapeHtml(s.source) + '</h3><pre>' + escapeHtml(s.content) + '</pre>';
      btn.addEventListener('click', function () {
        var others = sourcesList.querySelectorAll('.source-body.open');
        Array.prototype.forEach.call(others, function (el) {
          if (el !== body) el.classList.remove('open');
        });
        body.classList.toggle('open');
      });
      li.appendChild(btn);
      li.appendChild(body);
      sourcesList.appendChild(li);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var query = input.value.trim();
    if (!query) return;

    answerArea.innerHTML = '<span class="loading">检索中……（本地模型生成，请稍候）</span>';
    sourcesList.innerHTML = '<li class="empty">检索中……</li>';

    fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query })
    })
      .then(function (resp) {
        return resp.json().then(function (data) { return { status: resp.status, data: data }; });
      })
      .then(function (result) {
        if (result.status === 502) {
          answerArea.innerHTML = '<p>服务不可用：' + escapeHtml(result.data.detail) + '</p>';
          sourcesList.innerHTML = '';
          return;
        }
        answerArea.innerHTML = renderMarkdown(result.data.answer);
        renderSources(result.data.sources);
      })
      .catch(function (err) {
        answerArea.innerHTML = '<p>请求失败：' + escapeHtml(err.message) + '</p>';
      });
  });
})();
</script>
</body>
</html>
