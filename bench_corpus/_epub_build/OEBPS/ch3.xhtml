<?xml version="1.0" encoding="utf-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><title>第三章：检索与最佳格式</title></head><body><h1>第三章：检索与最佳格式</h1><p>提问来了：先把问题也变成向量，然后和库里每一块的向量比方向像不像，取最像的 top-k 块。数学上就是余弦相似度：点积衡量方向一致性，除以模长抵消长度影响，范围负一到一，越大越像。为什么用余弦不用距离？向量长度受文本长度影响，余弦只看方向更公平。向量化用什么格式输入最佳？Markdown。理由：结构完整，标题、表格、代码块都是切块与检索的强信号；纯文本会把这些结构抹平，PDF 表格转纯文本后语义粘连。让资料保持 Markdown 进管道，检索命中率和答案可追溯性都更好。</p><p><img src="images/rag_flow.png" alt="RAG 流程示意"/></p></body></html>
