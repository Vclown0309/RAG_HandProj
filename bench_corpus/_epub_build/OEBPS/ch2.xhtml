<?xml version="1.0" encoding="utf-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><title>第二章：切块与向量化</title></head><body><h1>第二章：切块与向量化</h1><p>模型每次能看的文字有限，先把文档切成小块，提问时只挑相关的几块。窗口切：固定 500 字一块、步长 450，重叠 50 字防止一句话被从中间切断。标题结构切：按文档标题分节，一个标题一块，标题是天然的语义边界。项目用两级策略：标题分节为主，某节超过 500 字在节内再窗口切；无标题文档退化为纯窗口切。电脑不懂意思但懂数字。嵌入模型把一段文字映射成一串数字（向量），规则是意思相近的文字向量方向也相近：猫和猫咪的向量挨得很近，猫和汽车的向量离得很远。向量是一串数字，数字本身没意义，方向才表达语义。</p></body></html>
