<?xml version="1.0" encoding="utf-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><title>第一章：RAG 与开卷考试</title></head><body><h1>第一章：RAG 与开卷考试</h1><p>检索增强生成（Retrieval-Augmented Generation）：回答前先从你的私有资料里查资料，把查到的原文塞进提问，再让模型基于资料回答。类比：开卷考试——裸问答是闭卷，模型只会背书上的还可能记错；RAG 是开卷，带着笔记进场翻到相关段落再答题。模型的记忆是训练时写死的，有两个硬伤：不知道你的事（你的笔记、公司文档模型从没见过）；会一本正经地胡说（记忆模糊时倾向编一个听起来合理的答案，这就是幻觉）。RAG 的思路是不改造模型，而是在提问时喂它需要的那几页资料——模型不擅长记忆，但擅长照着资料说话。</p></body></html>
