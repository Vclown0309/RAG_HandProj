  <text x="20" y="54" font-size="12" fill="#666">测试口径：9 嵌入 × 5 聊天 = 17 组，每组 12 道固定题；「检索命中（锚句在 top-3 块内）× 生成命中（核心词在答案内）」。</text>
  <text x="20" y="76" font-size="12" fill="#666">评分公式：综合评分（百分制）= 双命中题数 ÷ 12 × 100%；同一题检索、生成都命中才算 1 题；柱顶为分项「检索/生成」命中数。</text>
  <text x="20" y="96" font-size="12" fill="#888">测试机：Windows 11 / i9-14900K / 64GB / RTX 4090 D 24GB（llama.cpp b11337）；未测 ROCm 与 arm CPU。</text>
