<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="20" y="32" font-size="17" font-weight="bold" fill="#1a1a1a">嵌入模型纯检索对比（9 模型 × 库内 12 题）</text>
  <text x="20" y="54" font-size="12" fill="#666">口径：结构切块 → 全量向量化 → 余弦 top-3，锚句在 top-3 内即命中；只换嵌入模型。</text>
  <!-- 网格与刻度 -->
  <line x1="270" y1="70" x2="670" y2="70" stroke="#ccc" stroke-width="1"/>
  <line x1="270" y1="70" x2="270" y2="425" stroke="#ddd" stroke-width="1"/>
  <line x1="470" y1="70" x2="470" y2="425" stroke="#eee" stroke-width="1"/>
  <line x1="670" y1="70" x2="670" y2="425" stroke="#eee" stroke-width="1"/>
  <text x="270" y="437" font-size="11" fill="#999" text-anchor="middle">0</text>
  <text x="470" y="437" font-size="11" fill="#999" text-anchor="middle">6</text>
  <text x="670" y="437" font-size="11" fill="#999" text-anchor="middle">12</text>
  <!-- 数据行：名称(右对齐到250) + 柱(270起,每命中33.33px) + 数值 -->
  <!-- 1 Qwen3-4B-Q4 10/12 -->
  <text x="250" y="108" font-size="12.5" fill="#333" text-anchor="end">Qwen3-4B-Q4</text>
