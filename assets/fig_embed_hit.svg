  <text x="250" y="252" font-size="12.5" fill="#333" text-anchor="end">harrier-0.6B-BF16</text>
  <rect x="270" y="238" width="300" height="22" rx="3" fill="#57a55c"/>
  <text x="579" y="254" font-size="12.5" font-weight="bold" fill="#57a55c">9/12</text>
  <!-- 6 Qwen3-8B-Q5 9/12 -->
  <text x="250" y="288" font-size="12.5" fill="#333" text-anchor="end">Qwen3-8B-Q5</text>
