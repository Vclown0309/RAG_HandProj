<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="840" height="360" fill="#ffffff"/>
  <text x="20" y="32" font-size="17" font-weight="bold" fill="#1a1a1a">聊天模型端到端对比（4B-Q4 嵌入 × 5 聊天，库内 12 题）</text>
  <text x="20" y="54" font-size="12" fill="#666">口径：可追溯 = 答案带【资料N】引用；平均耗时 = 单题端到端（含检索+生成）；token/秒 = 生成速度。</text>
  <!-- 网格：可追溯刻度 0/6/12（柱区 x=270..620） -->
  <line x1="270" y1="70" x2="620" y2="70" stroke="#ccc" stroke-width="1"/>
  <line x1="270" y1="70" x2="270" y2="330" stroke="#ddd" stroke-width="1"/>
  <line x1="445" y1="70" x2="445" y2="330" stroke="#eee" stroke-width="1"/>
  <line x1="620" y1="70" x2="620" y2="330" stroke="#eee" stroke-width="1"/>
  <text x="270" y="342" font-size="11" fill="#999" text-anchor="middle">0</text>
  <text x="445" y="342" font-size="11" fill="#999" text-anchor="middle">6</text>
  <text x="620" y="342" font-size="11" fill="#999" text-anchor="middle">12</text>
  <text x="20" y="92" font-size="12" fill="#888">可追溯命中（/12）</text>
  <text x="20" y="310" font-size="12" fill="#888">平均耗时（秒/题）</text>
  <!-- 行1 Qwen3-4B-Q4: 12/12, 1.6s, 206 -->
  <text x="250" y="126" font-size="13" fill="#333" text-anchor="end">Qwen3-4B-Q4</text>
  <rect x="270" y="112" width="350" height="24" rx="3" fill="#2f6feb"/>
  <text x="584" y="130" font-size="13" font-weight="bold" fill="#ffffff">12/12</text>
  <text x="634" y="130" font-size="12" fill="#666">1.6s · 206 tok/s</text>
  <!-- 行2 Qwen3.5-9B-Q5: 12/12, 3.4s, 117 -->
  <text x="250" y="170" font-size="13" fill="#333" text-anchor="end">Qwen3.5-9B-Q5</text>
  <rect x="270" y="156" width="350" height="24" rx="3" fill="#2f6feb"/>
  <text x="584" y="174" font-size="13" font-weight="bold" fill="#ffffff">12/12</text>
  <text x="634" y="174" font-size="12" fill="#666">3.4s · 117 tok/s</text>
  <!-- 行3 Qwen3.8-27B-UD-Q5: 12/12, 77.8s 淘汰红 -->
  <text x="250" y="214" font-size="13" fill="#333" text-anchor="end">Qwen3.8-27B-UD-Q5</text>
  <rect x="270" y="200" width="350" height="24" rx="3" fill="#d4706f"/>
  <text x="584" y="218" font-size="13" font-weight="bold" fill="#ffffff">12/12</text>
  <text x="634" y="218" font-size="12" fill="#d4706f">77.8s · 4 tok/s（慢 20 倍，淘汰）</text>
  <!-- 行4 Qwen3-1.7B-Q4: 8/12, 0.8s, 366 -->
  <text x="250" y="258" font-size="13" fill="#333" text-anchor="end">Qwen3-1.7B-Q4</text>
  <rect x="270" y="244" width="233" height="24" rx="3" fill="#e6a23c"/>
  <text x="467" y="262" font-size="13" font-weight="bold" fill="#ffffff">8/12</text>
  <text x="517" y="262" font-size="12" fill="#666">0.8s · 366 tok/s</text>
  <!-- 行5 Qwen3.5-4B-Q5: 5/12, 14.1s, 185 -->
  <text x="250" y="302" font-size="13" fill="#333" text-anchor="end">Qwen3.5-4B-Q5</text>
  <rect x="270" y="288" width="146" height="24" rx="3" fill="#e6a23c"/>
  <text x="380" y="306" font-size="13" font-weight="bold" fill="#ffffff">5/12</text>
  <text x="430" y="306" font-size="12" fill="#666">14.1s · 185 tok/s</text>
  <!-- 图例 -->
  <rect x="20" y="316" width="12" height="12" fill="#2f6feb"/>
  <text x="38" y="327" font-size="11" fill="#666">满分（12/12）</text>
  <rect x="120" y="316" width="12" height="12" fill="#e6a23c"/>
  <text x="138" y="327" font-size="11" fill="#666">内容答对但常忘标引用</text>
  <rect x="320" y="316" width="12" height="12" fill="#d4706f"/>
  <text x="338" y="327" font-size="11" fill="#666">27B：质量无优势 + 极慢，淘汰</text>
</svg>
